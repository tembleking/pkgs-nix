name: Daily Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main

    - name: Run update scripts
      run: |
        for pkg in $(nix eval .#packages.x86_64-linux --apply 'ps: builtins.attrNames ps' --json | jq -r '.[]'); do
          script=$(nix eval --raw ".#packages.x86_64-linux.$pkg.updateScript" 2>/dev/null) || continue
          echo ">>> Updating $pkg"
          eval "$script"
        done

    - name: Check for changes
      id: check_changes
      run: |
        if git diff --exit-code; then
          echo "changes=none" >> $GITHUB_OUTPUT
        else
          echo "changes=detected" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push
      if: steps.check_changes.outputs.changes == 'detected'
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add -A
        git commit -m "Update packages"
        git push origin main
